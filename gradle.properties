org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Temporarily off while the build environment is stabilised; re-enable once builds are reliably
# green. This was NOT the cause of the "Failed to run Gradle Worker Daemon" failures -- that was
# a Gradle daemon running on JDK 21 against this project's Java 25 toolchain, which forces Gradle
# to fork a compiler worker instead of compiling in-process. Keep the daemon JVM on Java 25 (in
# IntelliJ: Build Tools > Gradle > Gradle JVM) and no worker is ever forked.
org.gradle.configuration-cache=false

minecraft_version=26.2
minecraft_version_range=[26.2]
neo_version=26.2.0.32-beta

