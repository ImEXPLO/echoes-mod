org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Disabled deliberately -- do not re-enable without re-testing a clean compile.
# With the configuration cache active, Gradle restores a serialized toolchain compiler spec it
# cannot prove matches the daemon JVM, so it forks a Gradle Worker Daemon to compile. Worker
# daemons handshake back to the build daemon over a loopback socket, which is blocked on this
# machine, so the worker dies with "finished with non-zero exit value 1" and no javac output at
# all. Without the configuration cache, Gradle recomputes the spec, sees the toolchain matches,
# and compiles in-process -- no socket, no worker, no failure.
org.gradle.configuration-cache=false

minecraft_version=26.2
minecraft_version_range=[26.2]
neo_version=26.2.0.32-beta

mod_id=memoryechoes
mod_name=Memory Echoes
mod_license=All Rights Reserved
mod_version=1.0.0
mod_group_id=com.explo.echoes
